<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h2 class="my-5">Forms:</h2>

        <div class="row">
            <div class="col-md-6">
                <h3>Inputs</h3>
                <form action="">
                    <div class="mb-3">
                        <label for="exampleInputEmail" class="form-label">Email address</label>
                        <input 
                            type="email"
                            class="form-control"
                            id="exampleInputEmail"
                            placeholder="name@example.com"
                        />
                        <div id="emailHelp" class="form-text">
                            We'll never share your email with anyone else.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="exampleInputPassword" class="form-label">Password</label>
                        <input 
                            type="password"
                            class="form-control"
                            id="exampleInputPassword"
                            placeholder="Enter your password"
                        />
                    </div>

                    <div class="mb-3 form-check">
                        <input 
                            type="checkbox" 
                            class="form-check-input" 
                            id="exampleCheck1"
                        >
                        <label 
                            class="form-check-label" 
                            for="exampleCheck1">
                            Check me out
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>

            <div class="col-md-6">
                <h3>Radio/checkboxes</h3>

                <div class="form-check">
                    <input type="checkbox"
                        class="form-check-input"
                        id="checkbox1"/>
                        <label for="checkbox1" class="form-check-label">
                            Check me out
                        </label>
                </div>

                <div class="form-check">
                    <input type="checkbox"
                        class="form-check-input"
                        id="checkbox1"
                        checked
                        />
                        <label for="checkbox1" class="form-check-label">
                            Checked checkbox
                        </label>
                </div>

                <div class="form-check">
                    <input type="checkbox"
                        class="form-check-input"
                        id="parentCheck"
                        />
                        <label for="parentCheck" class="form-check-label">
                            Indeterminate checkbox, select all
                        </label>
                </div>

                <div class="ms-3 mt-2">
                    <div class="form-check">
                        <input type="checkbox"
                            class="form-check-input child-check"
                            id="c1"
                            />
                            <label for="c1" class="form-check-label">
                                Option 1
                            </label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox"
                            class="form-check-input child-check"
                            id="c2"
                            />
                            <label for="c2" class="form-check-label">
                                Option 2
                            </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<script>
    const parent = document.getElementById("parentCheck");
    const children = document.querySelectorAll(".child-check");

    function updateParent() {
        const checked = [...children].filter(c => c.checked).length;

        if (checked === 0) {
            parent.checked = false;
            parent.indeterminate = false;
        } else if (checked === children.length) {
            parent.checked = true;
            parent.indeterminate = false;
        } else {
            parent.checked = false;
            parent.indeterminate = true;
        }
    }

    children.forEach(c => c.addEventListener("change", updateParent));

    parent.addEventListener("change", () => {
        children.forEach(c => c.checked = parent.checked);
        parent.indeterminate = false;
    });
</script>
